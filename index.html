<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Todo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #fff;
      color: #111;
      overscroll-behavior: none;
    }

    .app {
      max-width: 390px;
      margin: 0 auto;
      min-height: 100%;
      padding-bottom: 60px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .date-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px 14px;
      border-bottom: 1px solid #f0f0f0;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 28px;
      line-height: 1;
      color: #999;
      cursor: pointer;
      padding: 0 8px;
      user-select: none;
      transition: color 0.15s;
    }
    .nav-btn:hover { color: #333; }

    .date-title {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    /* ── Todo list ──────────────────────────────────────────── */
    .todo-list { list-style: none; padding: 6px 0; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 20px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      max-height: 60px;
      transition: max-height 0.35s ease, padding-top 0.35s ease,
                  padding-bottom 0.35s ease, opacity 0.25s ease;
    }

    .todo-item.removing {
      max-height: 0 !important;
      padding-top: 0;
      padding-bottom: 0;
      opacity: 0;
    }

    .todo-circle {
      width: 22px;
      height: 22px;
      border: 1.5px solid #bbb;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .todo-item.done .todo-circle {
      background: #555;
      border-color: #555;
    }

    .todo-text {
      font-size: 17px;
      line-height: 1.3;
      user-select: none;
      transition: opacity 0.45s ease;
    }

    .todo-item.done .todo-text { opacity: 0; }

    /* ── Add row ────────────────────────────────────────────── */
    .add-row {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
    }

    .add-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-row input:focus { border-color: #aaa; }

    .add-row button {
      padding: 10px 18px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
    }

    /* ── Physics canvas ─────────────────────────────────────── */
    #phy-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="date-header">
      <button class="nav-btn" id="btn-prev">&#8249;</button>
      <span class="date-title" id="date-display"></span>
      <button class="nav-btn" id="btn-next">&#8250;</button>
    </div>
    <ul class="todo-list" id="todo-list"></ul>
    <div class="add-row">
      <input id="new-task" type="text" placeholder="Add a task…" autocomplete="off" />
      <button id="btn-add">Add</button>
    </div>
  </div>

  <canvas id="phy-canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
  (() => {
    'use strict';

    // ── Date navigation ────────────────────────────────────────
    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    const day = new Date();

    function showDate() {
      document.getElementById('date-display').textContent =
        `${MONTHS[day.getMonth()]} ${day.getDate()}`;
    }
    showDate();

    document.getElementById('btn-prev').onclick = () => {
      day.setDate(day.getDate() - 1); showDate();
    };
    document.getElementById('btn-next').onclick = () => {
      day.setDate(day.getDate() + 1); showDate();
    };

    // ── Sample todos ───────────────────────────────────────────
    const SAMPLE = [
      'Tensorlake Explorations #1',
      'Tensorlake Explorations #2',
      'Collect items from the mailbox',
      'CVD Assignment + Reading',
      'Talk to Prof. Raquel',
      "Duke in LA - Karen's Midterm",
      "Duke in LA - Karen's Essay",
      'Project Blue - Full Screen Overheat',
    ];

    const listEl = document.getElementById('todo-list');

    function addTodo(text) {
      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML =
        '<div class="todo-circle"></div>' +
        '<span class="todo-text"></span>';
      li.querySelector('.todo-text').textContent = text;
      li.addEventListener('click', () => completeTodo(li));
      listEl.appendChild(li);
    }

    SAMPLE.forEach(addTodo);

    document.getElementById('btn-add').onclick = () => {
      const inp = document.getElementById('new-task');
      const text = inp.value.trim();
      if (text) { addTodo(text); inp.value = ''; }
    };
    document.getElementById('new-task').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-add').click();
    });

    // ── Physics setup ──────────────────────────────────────────
    const { Engine, Bodies, Body, World } = Matter;

    const canvas = document.getElementById('phy-canvas');
    const ctx    = canvas.getContext('2d');

    const engine = Engine.create({ gravity: { y: 2 } });
    const world  = engine.world;

    let ground, wallL, wallR;

    function setupBounds() {
      const W = canvas.width;
      const H = canvas.height;
      const app = document.getElementById('app').getBoundingClientRect();

      if (ground) World.remove(world, [ground, wallL, wallR]);

      ground = Bodies.rectangle(W / 2, H + 25, W * 3, 50,  { isStatic: true });
      wallL  = Bodies.rectangle(app.left  - 25, H / 2, 50, H * 3, { isStatic: true });
      wallR  = Bodies.rectangle(app.right + 25, H / 2, 50, H * 3, { isStatic: true });

      World.add(world, [ground, wallL, wallR]);
    }

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      setupBounds();
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ── Letter bodies ──────────────────────────────────────────
    const letters = []; // { body, char }
    const FONT_SIZE = 13;
    const FONT = `${FONT_SIZE}px Georgia, "Times New Roman", serif`;
    const MAX_BODIES = 600;

    function spawnLetters(text, rect) {
      // Measure cumulative character x-positions using canvas
      ctx.font = `17px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif`;
      let cx = rect.left;
      let delay = 0;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const cw   = ctx.measureText(char).width;

        if (char.trim() !== '') {
          const spawnX = cx + cw / 2;
          const spawnY = rect.top + rect.height / 2;
          const capturedChar = char;

          setTimeout(() => {
            if (letters.length >= MAX_BODIES) return;

            const body = Bodies.rectangle(
              spawnX + (Math.random() - 0.5) * 4,
              spawnY + (Math.random() - 0.5) * 3,
              Math.max(cw, 7), FONT_SIZE + 2,
              {
                restitution: 0.25,
                friction:    0.88,
                frictionAir: 0.012,
                angle: (Math.random() - 0.5) * 0.5,
              }
            );
            body.label = capturedChar;

            Body.setVelocity(body, {
              x: (Math.random() - 0.5) * 3,
              y:  Math.random() * 2,
            });
            Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.15);

            World.add(world, body);
            letters.push({ body, char: capturedChar });
          }, delay);

          delay += 28;
        }

        cx += cw;
      }
    }

    // ── Complete a todo ────────────────────────────────────────
    function completeTodo(li) {
      if (li.classList.contains('done')) return;

      const textEl = li.querySelector('.todo-text');
      const rect   = textEl.getBoundingClientRect();
      const text   = textEl.textContent;

      li.classList.add('done');
      spawnLetters(text, rect);

      setTimeout(() => {
        li.classList.add('removing');
        setTimeout(() => li.remove(), 380);
      }, 650);
    }

    // ── Stick figure ───────────────────────────────────────────
    function getPileTop() {
      if (letters.length < 2) return null;

      const app    = document.getElementById('app').getBoundingClientRect();
      const midX   = (app.left + app.right) / 2;
      const halfW  = (app.right - app.left) * 0.45;

      const pile = letters
        .map(l => l.body)
        .filter(b => Math.abs(b.position.x - midX) < halfW &&
                     b.position.y < canvas.height - 5);

      if (pile.length === 0) return null;

      const topY    = Math.min(...pile.map(b => b.position.y));
      const topTier = pile.filter(b => b.position.y <= topY + 25);
      const avgX    = topTier.reduce((s, b) => s + b.position.x, 0) / topTier.length;

      return { x: avgX, y: topY - 7 };
    }

    function drawPerson(x, y) {
      const bodyH = 15;
      const headR = 4.5;

      ctx.save();
      ctx.strokeStyle = '#111';
      ctx.fillStyle   = '#fff';
      ctx.lineWidth   = 1.8;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';

      // head
      ctx.beginPath();
      ctx.arc(x, y - bodyH - headR, headR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // body
      ctx.beginPath();
      ctx.moveTo(x, y - bodyH);
      ctx.lineTo(x, y);
      ctx.stroke();

      // arms
      ctx.beginPath();
      ctx.moveTo(x - 9, y - bodyH + 6);
      ctx.lineTo(x + 9, y - bodyH + 6);
      ctx.stroke();

      // legs
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 7, y + 11);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 7, y + 11);
      ctx.stroke();

      ctx.restore();
    }

    // ── Render loop ────────────────────────────────────────────
    let lastTs = 0;

    function frame(ts) {
      const dt = Math.min(ts - lastTs, 33);
      lastTs = ts;

      Engine.update(engine, dt || 16);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw letters
      ctx.font         = FONT;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = '#1a1a1a';

      for (const { body, char } of letters) {
        if (body.position.y > canvas.height + 80) continue;
        ctx.save();
        ctx.translate(body.position.x, body.position.y);
        ctx.rotate(body.angle);
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }

      // Draw stick figure
      const pos = getPileTop();
      if (pos) drawPerson(pos.x, pos.y);

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);

  })();
  </script>
</body>
</html>
